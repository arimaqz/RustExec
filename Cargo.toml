[package]
name = "rsexec"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Independent Windows process runner with temporary SCM service and named-pipe IO"
license = "MIT"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_Threading", "Win32_System_IO", "Win32_NetworkManagement_WNet"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
